[workspace]
authors = ["Christopher T. Lee <ctlee@ucsd.edu>"]
channels = ["conda-forge"]
name = "PackMem-leelab"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"
preview = ["pixi-build"]                          # Activate beta pixi-build feature

[tasks]

flat-test = "main/packmem.py -i tests/DPPC_flat_lipid_only.gro -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -o DPPC_flat_lipid_only"
strain2-test = "main/packmem.py -i tests/DPPC_strain.2_lipid_only.gro -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -o DPPC_strain.2_lipid_only"

dopc-strain2-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DOPC-strain.2-production7.9-stripped-centered.gro -t input/extended-data-v2/DOPC-strain.2-production7.9-stripped-centered.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DOPC-strain.2-production-stripped-centered-ext1800-cutoff"
dppc-strain2-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DPPC-strain.2-production7.9-stripped-centered.gro -t input/extended-data-v2/DPPC-strain.2-production7.9-stripped-centered.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DPPC-strain.2-production-stripped-centered-ext1800-cutoff"
dopc-dops-strain2-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DOPC-DOPS-strain.2-production7.9-stripped-centered.gro -t input/extended-data-v2/DOPC-DOPS-strain.2-production7.9-stripped-centered.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DOPC-DOPS-strain.2-production-stripped-centered-ext1800-cutoff"
dppc-dpps-strain2-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DPPC-DPPS-strain.2-production7.9-stripped-centered.gro -t input/extended-data-v2/DPPC-DPPS-strain.2-production7.9-stripped-centered.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DPPC-DPPS-strain.2-production-stripped-centered-ext1800-cutoff"
dppc-dppa-strain2-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DPPC-DPPA-strain.2-production7.9-stripped-centered.gro -t input/extended-data-v2/DPPC-DPPA-strain.2-production7.9-stripped-centered.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DPPC-DPPA-strain.2-production-stripped-centered-ext1800-cutoff"
dopc-dopa-strain2-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DOPC-DOPA-strain.2-production7.9-stripped-centered.gro -t input/extended-data-v2/DOPC-DOPA-strain.2-production7.9-stripped-centered.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DOPC-DOPA-strain.2-production-stripped-centered-ext1800-cutoff"

dopc-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DOPC-flat-production7.9-stripped.gro -t input/extended-data-v2/DOPC-flat-production7.9-stripped.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DOPC-flat-production-stripped-ext1800-cutoff"
dppc-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DPPC-flat-production7.9-stripped.gro -t input/extended-data-v2/DPPC-flat-production7.9-stripped.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DPPC-flat-production-stripped-ext1800-cutoff"
dopc-dops-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DOPC-DOPS-flat-production7.9-stripped.gro -t input/extended-data-v2/DOPC-DOPS-flat-production7.9-stripped.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DOPC-DOPS-flat-production-stripped-ext1800-cutoff"
dppc-dpps-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DPPC-DPPS-flat-production7.9-stripped.gro -t input/extended-data-v2/DPPC-DPPS-flat-production7.9-stripped.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DPPC-DPPS-flat-production-stripped-ext1800-cutoff"
dppc-dppa-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DPPC-DPPA-flat-production7.9-stripped.gro -t input/extended-data-v2/DPPC-DPPA-flat-production7.9-stripped.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DPPC-DPPA-flat-production-stripped-ext1800-cutoff"
dopc-dopa-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DOPC-DOPA-flat-production7.9-stripped.gro -t input/extended-data-v2/DOPC-DOPA-flat-production7.9-stripped.xtc -r main/vdw_radii_CGMartini3_openbeta2_updated.txt -d 6.3801 -o DOPC-DOPA-flat-production-stripped-ext1800-cutoff"

dopc-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DOPC-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DOPC-strain.2-production7.9-stripped-centered.xtc 5 dopc-strain.2-ext1800"
dppc-strain2-trajectory-curvature-ext = "main/curvature.py  input/extended-data-v2/DPPC-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DPPC-strain.2-production7.9-stripped-centered.xtc 5 dppc-strain.2-ext1800"
dopc-dops-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DOPC-DOPS-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DOPC-DOPS-strain.2-production7.9-stripped-centered.xtc 5 dopc-dops-strain.2-ext1800"
dppc-dpps-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DPPC-DPPS-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DPPC-DPPS-strain.2-production7.9-stripped-centered.xtc 5 dppc-dpps-strain.2-ext1800"
dppc-dppa-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DPPC-DPPA-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DPPC-DPPA-strain.2-production7.9-stripped-centered.xtc 5 dppc-dppa-strain.2-ext1800"
dopc-dopa-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DOPC-DOPA-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DOPC-DOPA-strain.2-production7.9-stripped-centered.xtc 5 dopc-dopa-strain.2-ext1800"

dopc-compression = "main/curvature.py compression-data/system1-DOPC/large-compression.gro compression-data/system1-DOPC/large-compression.xtc 5 DOPC-compression"
dppc-compression = "main/curvature.py compression-data/system2-DPPC/large-compression.gro compression-data/system2-DPPC/large-compression.xtc 5 DPPC-compression"
dopc-dops-compression = "main/curvature.py compression-data/system3-DOPC-DOPS/large-compression.gro compression-data/system3-DOPC-DOPS/large-compression.xtc 1 DOPC-DOPS-compression"
dppc-dpps-compression = "main/curvature.py compression-data/system4-DPPC-DPPS/large-compression.gro compression-data/system4-DPPC-DPPS/large-compression.xtc 5 DPPC-DPPS-compression"
dppc-dppa-compression = "main/curvature.py compression-data/system5-DPPC-DPPA/large-compression.gro compression-data/system5-DPPC-DPPA/large-compression.xtc 5 DPPC-DPPA-compression"
dopc-dopa-compression = "main/curvature.py compression-data/system6-DOPC-DOPA/large-compression.gro compression-data/system6-DOPC-DOPA/large-compression.xtc 5 DOPC-DOPA-compression"

[dependencies]
python = ">=3.14.2,<3.15"
mdanalysis = ">=2.10.0,<3"
tqdm = ">=4.67.1,<5"
scipy = ">=1.16.3,<2"
ctleelab_plothelper = { git = "https://github.com/ctleelab/ctleelab-mpl-utilities", branch = "main" }
black = ">=26.1.0,<27"

[pypi-dependencies]
circle-fit = ">=0.2.1, <0.3"
