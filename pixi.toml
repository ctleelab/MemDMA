dppc-dppa-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DPPC-DPPA-flat-production7.9-stripped.gro -t input/extended-data-v2/DPPC-DPPA-flat-production7.9-stripped.xtc -o DPPC-DPPA-flat-production-stripped-ext1800-cutoff"
dopc-dopa-flat-trajectory-ext1800-cutoff = "main/packmem.py -i input/extended-data-v2/DOPC-DOPA-flat-production7.9-stripped.gro -t input/extended-data-v2/DOPC-DOPA-flat-production7.9-stripped.xtc -o DOPC-DOPA-flat-production-stripped-ext1800-cutoff"

dopc-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DOPC-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DOPC-strain.2-production7.9-stripped-centered.xtc 5 dopc-strain.2-ext1800 40 circl-fit/prodext1800/dopc-strain.2-ext1800 "
dppc-strain2-trajectory-curvature-ext = "main/curvature.py  input/extended-data-v2/DPPC-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DPPC-strain.2-production7.9-stripped-centered.xtc 5 dppc-strain.2-ext1800 40 circl-fit/prodext1800/dppc-strain.2-ext1800"
dopc-dops-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DOPC-DOPS-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DOPC-DOPS-strain.2-production7.9-stripped-centered.xtc 5 dopc-dops-strain.2-ext1800 40 circl-fit/prodext1800/dopc-dops-strain.2-ext1800"
dppc-dpps-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DPPC-DPPS-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DPPC-DPPS-strain.2-production7.9-stripped-centered.xtc 5 dppc-dpps-strain.2-ext1800 40 circl-fit/prodext1800/dppc-dpps-strain.2-ext1800"
dppc-dppa-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DPPC-DPPA-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DPPC-DPPA-strain.2-production7.9-stripped-centered.xtc 5 dppc-dppa-strain.2-ext1800 40 circl-fit/prodext1800/dppc-dppa-strain.2-ext1800"
dopc-dopa-strain2-trajectory-curvature-ext = "main/curvature.py input/extended-data-v2/DOPC-DOPA-strain.2-production7.9-stripped-centered.gro input/extended-data-v2/DOPC-DOPA-strain.2-production7.9-stripped-centered.xtc 5 dopc-dopa-strain.2-ext1800 40 circl-fit/prodext1800/dopc-dopa-strain.2-ext1800"


[dependencies]
python = ">=3.14.2,<3.15"
mdanalysis = ">=2.10.0,<3"
tqdm = ">=4.67.1,<5"
scipy = ">=1.16.3,<2"
ctleelab_plothelper = { git = "https://github.com/ctleelab/ctleelab-mpl-utilities", branch = "main" }
black = ">=26.1.0,<27"

[pypi-dependencies]
circle-fit = ">=0.2.1, <0.3"
